<script>
  function getdata() {
   
            var password = $("#password").val();
            var email = $("#email").val().trim();
            if (email == '' || password == '')
            {
              alert("Please Fill the Required Fields");
              return;
            }
            var data = {email: email, password:password};
            let post = JSON.stringify(data);
            $.ajax({
                url: 'http://localhost:4000/getdata',
                headers: {
                    'Content-Type': 'application/json'
                },
                type: 'POST',
                contentType: 'application/json',
                data:post,
                success: function (data) {
                    if (data == 1)
                    {
                      window.open("dashboard.html");
                      $('#sign')[0].reset(); // Clear form fields
                    }
                    else if (data == -1)
                    {
                      checkAdmin();
                    }else {
                      alert("Login Failed");
                    }
                 
                },
                error: function () {
                    alert('error');
                }
            });
        }
function checkAdmin(){
           var password = $("#password").val();
            var email = $("#email").val().trim();
  var data = {email: email, password:password};
            let post = JSON.stringify(data);
            $.ajax({
                url: 'http://localhost:4000/getdataAdmin',
                headers: {
                    'Content-Type': 'application/json'
                },
                type: 'POST',
                contentType: 'application/json',
                data:post,
                success: function (data) {
                    if (data == 1)
                    {
                      window.open("admin.html");
                    }
                    else {
                      alert("Login Failed");
                    }
                 
                },
                error: function () {
                    alert('error');
                }
            });
}
